// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.wear_kotlin_version = '2.2.20'
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        // Native push for the sideload and Play builds: the Google Services plugin reads the
        // app/google-services.json that a self-hoster or the release machine provides. It is
        // added only when that file is there, so a build without Firebase credentials, and the
        // F-Droid build (which has no file), keeps a clean classpath.
        if (file('app/google-services.json').exists()) {
            classpath 'com.google.gms:google-services:4.4.3'
        }
        // Kotlin, Compose and kotlinx.serialization for the Wear OS module (wear/) only; app/ stays
        // Java and builds exactly as before.
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$wear_kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$wear_kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$wear_kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.layout.buildDirectory
}
