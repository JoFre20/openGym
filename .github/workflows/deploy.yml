name: Deploy openGym (Docker)

on:
  push:
    branches:
      - main # Löst das Deployment bei jedem Push in main aus

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH to Server and Deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd openGym/
            
            # Neueste Code-Änderungen aus GitHub laden
            git pull origin main
            
            # Container mit dem neuen Code bauen und im Hintergrund neustarten
            docker compose up -d --build
            
            # Optional: Alte, ungenutzte Images löschen, um Server-Speicherplatz freizugeben
            docker image prune -f
